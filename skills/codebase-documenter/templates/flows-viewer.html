<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business flows</title>
<!-- Generated by codebase-documenter flow_pages.py from docs/_src/workflows/flows/*.flow.json. Self-contained, works offline. -->
<style>
:root{--bg:#fff;--fg:#1d2330;--muted:#5d6676;--line:#d5dae3;--lane:#f6f8fb;--lane2:#eef2f7;--node:#fff;--accent:#2f6fde;--accent-soft:#e3ecfc;--dec:#fff7e0;--dec-b:#c99a1c;--data:#e9f6ef;--data-b:#2f8a57;--ext:#f3ecfb;--ext-b:#7a4fc0;--end:#eef0f3;--hl:#e8590c}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e4e8ef;--muted:#9aa3b2;--line:#353c48;--lane:#191d24;--lane2:#1e232b;--node:#222833;--accent:#6ea0ff;--accent-soft:#22324f;--dec:#3a3220;--dec-b:#d9b14a;--data:#1d3328;--data-b:#5cc28a;--ext:#2d2440;--ext-b:#a98be0;--end:#262b33;--hl:#ff8a3d}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:260px 1fr 320px;height:100vh}
#app.embed{grid-template-columns:0 1fr 300px}#app.embed #side{display:none}
#side,#info{overflow:auto;border-right:1px solid var(--line);padding:12px}#info{border-right:0;border-left:1px solid var(--line)}
#side input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--node);color:var(--fg)}
.flow{padding:8px 9px;border-radius:6px;cursor:pointer;margin-top:4px}.flow:hover{background:var(--lane2)}.flow.on{background:var(--accent-soft)}
.flow b{display:block;font-weight:600}.flow small{color:var(--muted)}
#main{position:relative;overflow:hidden}#bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;z-index:2;pointer-events:none}
#bar>*{pointer-events:auto}#bar h1{font-size:15px;margin:0 8px 0 0;padding:5px 9px;background:var(--bg);border-radius:6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{border:1px solid var(--line);background:var(--node);color:var(--fg);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}button:hover{border-color:var(--accent)}
svg{width:100%;height:100%;cursor:grab;user-select:none}svg.drag{cursor:grabbing}
.lanehead{font-weight:600;font-size:13px;fill:var(--fg)}.laneband{fill:var(--lane)}.laneband.alt{fill:var(--lane2)}
.node rect,.node path,.node ellipse{fill:var(--node);stroke:var(--line);stroke-width:1.4}.node text{fill:var(--fg);font-size:12.5px}
.node.decision path{fill:var(--dec);stroke:var(--dec-b)}.node.data rect,.node.data ellipse{fill:var(--data);stroke:var(--data-b)}
.node.external rect{fill:var(--ext);stroke:var(--ext-b)}.node.end rect,.node.start rect{fill:var(--end)}
.node.linked text.code{fill:var(--accent);font-size:11px}.node{cursor:pointer}.node:hover rect,.node:hover path{stroke:var(--accent)}
.edge path{fill:none;stroke:var(--muted);stroke-width:1.4}.edge text{font-size:11px;fill:var(--muted)}
.dim{opacity:.25}.sel rect,.sel path,.sel ellipse{stroke:var(--hl)!important;stroke-width:2.6!important}.edge.hot path{stroke:var(--hl);stroke-width:2.2}
#info h2{font-size:15px;margin:2px 0 6px}#info .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-top:12px}
#info code{font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--lane2);padding:1px 4px;border-radius:4px;word-break:break-word}
#info a{color:var(--accent)}#info ul{padding-left:18px;margin:4px 0}.pill{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--lane2);font-size:12px;margin-right:4px}
#app.embed{grid-template-columns:1fr;grid-template-rows:1fr 170px}#app.embed #info{border-left:0;border-top:1px solid var(--line)}
@media (max-width:900px){#app:not(.embed){grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}#side{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}#app:not(.embed) #info{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <aside id="side"><input id="q" placeholder="Search flows and steps" aria-label="Search flows"><div id="list"></div></aside>
  <main id="main">
    <div id="bar"><h1 id="title"></h1><button id="prev" title="Previous step (←)">◀</button><button id="next" title="Next step (→)">Walk through ▶</button><button id="fit">Fit</button><button id="zin">+</button><button id="zout">−</button></div>
    <svg id="svg" role="img" aria-label="Flow chart"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs><g id="vp"></g></svg>
  </main>
  <aside id="info"></aside>
</div>
<script id="flows-data" type="application/json">/*FLOWS_DATA*/</script>
<script>
(function(){
const FLOWS=JSON.parse(document.getElementById('flows-data').textContent);
const LW=230,RH=104,HEAD=56,NW=196,NH=62,$=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
let cur=null,view={x:0,y:0,k:1},walk=-1,sel=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function wrap(text,max){const words=String(text).split(/\s+/),lines=[];let l='';for(const w of words){if((l+' '+w).trim().length>max&&l){lines.push(l);l=w}else l=(l+' '+w).trim()}if(l)lines.push(l);return lines.slice(0,3).map((x,i,a)=>i==2&&a.length==3&&lines.length>3?x+'…':x)}
function layout(f){
  const ids=f.steps.map(s=>s.id),by={};f.steps.forEach(s=>by[s.id]=s);
  const out={},inn={};ids.forEach(i=>{out[i]=[];inn[i]=[]});
  f.edges.forEach(e=>{out[e.from].push(e);inn[e.to].push(e)});
  const state={},back=new Set();
  function dfs(i){state[i]=1;for(const e of out[i]){if(state[e.to]===1)back.add(e);else if(!state[e.to])dfs(e.to)}state[i]=2}
  ids.filter(i=>!inn[i].length).concat(ids).forEach(i=>{if(!state[i])dfs(i)});
  const order=[],seen={},deg={};ids.forEach(i=>deg[i]=inn[i].filter(e=>!back.has(e)).length);
  const q=ids.filter(i=>!deg[i]);while(q.length){const i=q.shift();order.push(i);for(const e of out[i])if(!back.has(e)&&--deg[e.to]===0)q.push(e.to)}
  ids.forEach(i=>{if(!order.includes(i))order.push(i)});
  const rank={},used=new Set(),lane=s=>f.lanes.indexOf(s.lane);
  for(const i of order){let r=0;for(const e of inn[i])if(!back.has(e)&&rank[e.from]!=null)r=Math.max(r,rank[e.from]+1);while(used.has(lane(by[i])+':'+r))r++;rank[i]=r;used.add(lane(by[i])+':'+r)}
  const pos={};ids.forEach(i=>pos[i]={x:lane(by[i])*LW+LW/2,y:HEAD+rank[i]*RH+RH/2});
  return {pos,back,rows:Math.max(0,...Object.values(rank))+1}
}
function draw(f){
  const vp=$('#vp');vp.innerHTML='';const L=layout(f);cur.L=L;
  const H=HEAD+L.rows*RH+20;
  f.lanes.forEach((ln,k)=>{el('rect',{x:k*LW,y:0,width:LW,height:H,class:'laneband'+(k%2?' alt':'')},vp);const t=el('text',{x:k*LW+LW/2,y:30,'text-anchor':'middle',class:'lanehead'},vp);t.textContent=ln});
  const eg=el('g',{},vp),ng=el('g',{},vp);
  f.edges.forEach((e,k)=>{const a=L.pos[e.from],b=L.pos[e.to],g=el('g',{class:'edge','data-from':e.from,'data-to':e.to},eg);let d;
    if(L.back.has(e)||b.y<=a.y){const x=Math.max(a.x,b.x)+NW/2+18+(k%3)*8;d=`M${a.x+NW/2},${a.y} C${x},${a.y} ${x},${b.y} ${b.x+NW/2},${b.y}`}
    else d=`M${a.x},${a.y+NH/2} C${a.x},${(a.y+b.y)/2} ${b.x},${(a.y+b.y)/2} ${b.x},${b.y-NH/2-2}`;
    el('path',{d,'marker-end':'url(#arr)',style:'color:var(--muted)'},g);
    if(e.label){const t=el('text',{x:(a.x+b.x)/2+6,y:(a.y+b.y)/2-4},g);t.textContent=e.label}});
  f.steps.forEach((s,idx)=>{const p=L.pos[s.id],g=el('g',{class:'node '+(s.kind||'step')+(s.links&&s.links.length?' linked':''),'data-id':s.id,transform:`translate(${p.x-NW/2},${p.y-NH/2})`,tabindex:0},ng);
    if(s.kind==='decision')el('path',{d:`M${NW/2},-6 L${NW+6},${NH/2} L${NW/2},${NH+6} L-6,${NH/2}z`},g);
    else if(s.kind==='data'){el('rect',{width:NW,height:NH,rx:10},g);el('ellipse',{cx:NW/2,cy:0,rx:NW/2,ry:6},g)}
    else el('rect',{width:NW,height:NH,rx:s.kind==='end'||s.kind==='start'?NH/2:7},g);
    const lines=wrap(s.label,s.kind==='decision'?22:28),code=s.links&&s.links[0]?s.links[0].label:'';
    const n=lines.length+(code?1:0);let y=NH/2-(n-1)*8+4;
    lines.forEach(l=>{const t=el('text',{x:NW/2,y,'text-anchor':'middle'},g);t.textContent=l;y+=16});
    if(code){const t=el('text',{x:NW/2,y,'text-anchor':'middle',class:'code'},g);t.textContent=code.length>32?code.slice(0,31)+'…':code}
    const num=el('text',{x:6,y:13,style:'font-size:10px;fill:var(--muted)'},g);num.textContent=idx+1;
    g.addEventListener('click',ev=>{ev.stopPropagation();select(s.id)});g.addEventListener('keydown',ev=>{if(ev.key==='Enter')select(s.id)})});
  cur.W=f.lanes.length*LW;cur.H=H;fit();
}
function apply(){$('#vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`)}
function fit(){const r=$('#svg').getBoundingClientRect(),k=Math.min(1.2,(r.width-20)/cur.W,(r.height-60)/cur.H);view.k=Math.max(.2,k);view.x=(r.width-cur.W*view.k)/2;view.y=48;apply()}
function reach(id,dir){const res=new Set([id]),st=[id];while(st.length){const i=st.pop();cur.edges.forEach(e=>{const [a,b]=dir>0?[e.from,e.to]:[e.to,e.from];if(a===i&&!res.has(b)){res.add(b);st.push(b)}})}return res}
function select(id){
  sel=id;walk=cur.steps.findIndex(s=>s.id===id);const up=reach(id,-1),down=reach(id,1),on=new Set([...up,...down]);
  document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('sel',n.dataset.id===id);n.classList.toggle('dim',!on.has(n.dataset.id))});
  document.querySelectorAll('.edge').forEach(e=>{const hot=e.dataset.from===id||e.dataset.to===id;e.classList.toggle('hot',hot);e.classList.toggle('dim',!(on.has(e.dataset.from)&&on.has(e.dataset.to)))});
  const s=cur.steps.find(x=>x.id===id);history.replaceState(null,'','#'+cur.id+'/'+id+(embed?'&embed':''));info(s)
}
function clear(){sel=null;document.querySelectorAll('.dim,.sel,.hot').forEach(n=>n.classList.remove('dim','sel','hot'));info(null)}
function info(s){
  const f=cur,box=$('#info');
  if(!s){box.innerHTML=`<h2>${esc(f.title)}</h2>${f.summary?`<p>${esc(f.summary)}</p>`:''}`+
    (f.module?`<div class="k">Module</div><div>${esc(f.module)}</div>`:'')+(f.trigger?`<div class="k">Trigger</div><div>${esc(f.trigger)}</div>`:'')+
    (f.outcome?`<div class="k">Outcome</div><div>${esc(f.outcome)}</div>`:'')+`<div class="k">Lanes</div><div>${f.lanes.map(l=>`<span class="pill">${esc(l)}</span>`).join('')}</div>`+
    (f.page?`<div class="k">Page</div><a target="_top" href="${esc(f.page)}">Read the flow page</a>`:'')+(f.notes&&f.notes.length?`<div class="k">Notes</div><ul>${f.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'')+
    `<p style="color:var(--muted);font-size:12px;margin-top:16px">Click a step for its code; ← → walk through the steps; drag to pan, wheel to zoom.</p>`;return}
  const nexts=cur.edges.filter(e=>e.from===s.id).map(e=>cur.steps.find(x=>x.id===e.to)).filter(Boolean);
  box.innerHTML=`<div class="k">Step ${cur.steps.indexOf(s)+1} · ${esc(s.lane)}${s.kind&&s.kind!=='step'?' · '+esc(s.kind):''}</div><h2>${esc(s.label)}</h2>`+
    (s.data?`<div class="k">Data</div><div>${esc(s.data)}</div>`:'')+(s.note?`<div class="k">Note</div><div>${esc(s.note)}</div>`:'')+
    (s.links||[]).map(l=>`<div class="k">Code</div><div>${l.url?`<a target="_top" href="${esc(l.url)}">${esc(l.label)}</a>`:esc(l.label)}</div>`+
      (l.file?`<div><code>${esc(l.file)}${l.line?':'+l.line:''}</code></div>`:'')+(l.decl?`<div style="margin-top:4px"><code>${esc(l.decl)}</code></div>`:'')+
      (l.calls&&l.calls.length?`<div class="k">Calls</div><ul>${l.calls.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'')+
      (l.callers&&l.callers.length?`<div class="k">Called by</div><ul>${l.callers.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'')).join('')+
    (nexts.length?`<div class="k">Next</div><ul>${nexts.map(n=>`<li><a href="#" data-go="${esc(n.id)}">${esc(n.label)}</a></li>`).join('')}</ul>`:'');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=ev=>{ev.preventDefault();select(a.dataset.go)})
}
function open(id,step){cur=FLOWS.find(f=>f.id===id)||FLOWS[0];if(!cur)return;walk=-1;$('#title').textContent=cur.title;document.title=cur.title+' · Business flows';
  document.querySelectorAll('.flow').forEach(n=>n.classList.toggle('on',n.dataset.id===cur.id));draw(cur);if(step&&cur.steps.some(s=>s.id===step))select(step);else{clear();history.replaceState(null,'','#'+cur.id+(embed?'&embed':''))}}
function list(){const q=$('#q').value.toLowerCase();$('#list').innerHTML=FLOWS.filter(f=>!q||JSON.stringify([f.title,f.module,f.summary,f.steps.map(s=>s.label+' '+(s.links||[]).map(l=>l.label).join(' '))]).toLowerCase().includes(q))
  .map(f=>`<div class="flow${cur&&f.id===cur.id?' on':''}" data-id="${esc(f.id)}"><b>${esc(f.title)}</b><small>${esc(f.module||'')}${f.module?' · ':''}${f.steps.length} steps</small></div>`).join('')||'<p style="color:var(--muted)">No match</p>';
  document.querySelectorAll('.flow').forEach(n=>n.onclick=()=>open(n.dataset.id))}
const svg=$('#svg');let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX-view.x,y:e.clientY-view.y,moved:false};svg.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!drag)return;view.x=e.clientX-drag.x;view.y=e.clientY-drag.y;drag.moved=true;apply()});
window.addEventListener('mouseup',()=>{if(drag&&!drag.moved)clear();drag=null;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.min(3,Math.max(.2,view.k*(e.deltaY<0?1.12:1/1.12)));
  view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;apply()},{passive:false});
function zoom(f){const r=svg.getBoundingClientRect(),mx=r.width/2,my=r.height/2,k=Math.min(3,Math.max(.2,view.k*f));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;apply()}
$('#fit').onclick=fit;$('#zin').onclick=()=>zoom(1.2);$('#zout').onclick=()=>zoom(1/1.2);
const step=d=>{if(!cur)return;walk=Math.min(cur.steps.length-1,Math.max(0,walk+d));select(cur.steps[walk].id)};
$('#next').onclick=()=>step(1);$('#prev').onclick=()=>step(-1);
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape')clear()});
window.addEventListener('resize',()=>cur&&fit());$('#q').oninput=list;
const h=decodeURIComponent(location.hash.slice(1)),embed=/(^|&)embed/.test(h);if(embed)$('#app').classList.add('embed');
const [fid,sid]=h.replace(/&embed/,'').split('/');
if(!FLOWS.length){$('#title').textContent='No flows yet';$('#info').innerHTML='<p>Write docs/_src/workflows/flows/&lt;id&gt;.flow.json and rebuild.</p>'}else{list();open(fid,sid);list()}
})();
</script>
</body>
</html>
